events {
    worker_connections 1024;
}

http {
    # DNS interno de Docker para no cachear IPs viejas de los servicios
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # Errores propios del gateway cuando no logra comunicarse con un servicio.
        # Las respuestas de error de los servicios se reenvían sin cambios.
        error_page 502 503 = @servicio_no_disponible;
        error_page 504 = @servicio_sin_respuesta;

        location @servicio_no_disponible {
            default_type application/json;
            return 502 '{"error": "Bad Gateway", "message": "El gateway no pudo comunicarse con el servicio solicitado.", "status": 502}';
        }

        location @servicio_sin_respuesta {
            default_type application/json;
            return 504 '{"error": "Gateway Timeout", "message": "Tiempo de espera agotado esperando al servicio solicitado.", "status": 504}';
        }

        # Aqui mostramos el home
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Redirección a Docentes
        location /docentes {
            set $docentes_upstream docentes-service;
            proxy_pass http://$docentes_upstream:5001;
        }

        # Redirección a Cursos
        location /cursos {
            set $cursos_upstream cursos-service;
            proxy_pass http://$cursos_upstream:5002;
        }

        # Redirección a Estudiantes
        location /estudiantes {
            set $estudiantes_upstream estudiantes-service;
            proxy_pass http://$estudiantes_upstream:5003;
        }

        # Redirección a Matrículas
        location /matriculas {
            set $matriculas_upstream matriculas-service;
            proxy_pass http://$matriculas_upstream:5004;
        }

        # Redirección a Notas
        location /notas {
            set $notas_upstream notas-service;
            proxy_pass http://$notas_upstream:5005;
        }
    }
}
